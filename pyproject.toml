[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yaracompilereview"
version = "1.0.0"
description = "Bounded offline evidence review: YaraCompileReview"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = ["yara-python==4.5.4"]

[project.scripts]
yaracompilereview = "yaracompilereview.core:main"

[tool.setuptools.packages.find]
where = ["src"]
